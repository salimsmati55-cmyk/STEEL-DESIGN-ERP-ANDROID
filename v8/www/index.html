<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>STEEL DESIGN ERP V8.3</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">SD</div>
      <div class="brand-copy"><b>STEEL DESIGN ERP</b><small>إدارة الورشة والتصنيع</small></div>
    </div>
    <div class="top-actions">
      <span id="dbState" class="status"><i class="status-dot"></i> جارٍ فتح قاعدة البيانات…</span>
      <button id="backupBtn" class="btn ghost" type="button"><span class="action-symbol">⇩</span> نسخة احتياطية</button>
      <label class="btn ghost file-btn"><span class="action-symbol">↥</span> استيراد<input id="restoreFile" type="file" accept="application/json"></label>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="القائمة الرئيسية">
      <div class="side-heading">مساحة العمل</div>
      <button class="nav active" data-view="dashboard" data-icon="dashboard"><span>لوحة التحكم</span><small>نظرة عامة على الورشة</small></button>
      <div class="side-heading section-heading">الطلبات والتصنيع</div>
      <button class="nav" data-view="orders" data-icon="orders"><span>الطلبيات</span><small>كل طلبات الزبائن</small></button>
      <button class="nav" data-view="newOrder" data-icon="add"><span>طلبية جديدة</span><small>استقبال عمل جديد</small></button>
      <button class="nav" data-view="production" data-icon="production"><span>الإنتاج</span><small>مراحل العمل والمتابعة</small></button>
      <div class="side-heading section-heading">المواد والعملاء</div>
      <button class="nav" data-view="customers" data-icon="customers"><span>الزبائن</span><small>ملفات الزبائن</small></button>
      <button class="nav" data-view="receiving" data-icon="receiving"><span>استلام المواد · REC</span><small>تسجيل المواد الواردة</small></button>
      <button class="nav" data-view="inventory" data-icon="inventory"><span>المخزون</span><small>المناطق A وB وC</small></button>
      <div class="side-note"><span class="side-note-mark">SD</span><div><b>STEEL DESIGN</b><small>نسخة الويب · V8.3</small></div></div>
    </aside>
    <main id="app" class="main"><div class="loading">يتم تجهيز مساحة العمل…</div></main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
