<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<title>STEEL DESIGN ERP V11.2 — Order Edit</title>
<style>
:root{font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#182536;background:#f5f7fa;--line:#e2e8f0;--blue:#1d4ed8;--muted:#718096}
*{box-sizing:border-box}body{margin:0;background:#f5f7fa}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 13px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:9px}.logo{width:36px;height:36px;border-radius:10px;background:#172f52;color:white;display:grid;place-items:center;font-weight:900}.brand b{font-size:13px}.brand small{display:block;font-size:9px;color:var(--muted);margin-top:3px}
main{padding:14px 12px 90px;max-width:760px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0 14px}.pagehead h1{font-size:20px;margin:0 0 4px}.muted{font-size:11px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;color:#25364b;border-radius:9px;padding:10px 12px;font-weight:700;font-size:12px}.btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:white}.btn.soft{background:#eef3ff;color:#1d4ed8;border-color:#dbe6ff}.btn.danger{color:#b91c1c}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:0 3px 14px #1e293b06}.stat-label{font-size:11px;color:var(--muted)}.stat-value{font-size:24px;font-weight:900;margin-top:7px}.panel{margin-top:12px}.panel h2{font-size:14px;margin:0 0 12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#fff;border-top:1px solid var(--line);display:flex;gap:4px;overflow:auto;padding:7px 6px calc(7px + env(safe-area-inset-bottom));}
nav button{flex:1;min-width:62px;border:0;background:transparent;border-radius:8px;padding:9px 5px;font-size:10px;color:#526174;font-weight:bold}nav button.active{background:#eaf1ff;color:#1d4ed8}
.list{display:grid;gap:8px}.job{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.jobtop{display:flex;justify-content:space-between;gap:8px}.job b{font-size:12px}.job p{font-size:11px;color:var(--muted);margin:6px 0}.pill{font-size:10px;background:#eaf8ef;color:#15803d;border-radius:20px;padding:5px 8px;white-space:nowrap}
.modal{position:fixed;inset:0;background:#0f172a77;z-index:10;display:none;align-items:flex-end;padding:0}.modal.open{display:flex}.dialog{background:#fff;border-radius:18px 18px 0 0;padding:15px 13px calc(18px + env(safe-area-inset-bottom));width:100%;max-height:94dvh;overflow:auto}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dialoghead h2{font-size:17px;margin:0}
.formgrid{display:grid;grid-template-columns:1fr;gap:11px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:bold;color:#526174}.field input,.field select,.field textarea{border:1px solid #d5dee9;border-radius:9px;padding:11px;background:white;color:#182536;width:100%;font-size:16px;min-height:44px}.field textarea{min-height:75px}
.kroki{border:1px solid #dbe4ef;border-radius:12px;padding:10px;background:#fbfdff}.khead{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:9px}.khead span,.hint{font-size:10px;color:#718096}.tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.tools button{border:1px solid #d7e0eb;background:#fff;border-radius:8px;padding:8px 9px;font-size:11px;min-height:36px}.canvaswrap{height:160px;overflow:auto;border:1px solid #cbd5e1;border-radius:8px;background:white;touch-action:pan-x pan-y}.canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.photo{width:74px;height:74px;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;top:2px;left:2px;border:0;border-radius:50%;background:#fff}
.expanded{position:fixed;inset:5px;z-index:20;background:white;display:flex;flex-direction:column}.expanded .canvaswrap{height:auto;flex:1}.tool.active{background:#eaf1ff!important;border-color:#1d4ed8!important;color:#1d4ed8;font-weight:900}.kroki .tools button{min-width:42px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;padding:24px;color:var(--muted);font-size:12px}
@media(min-width:700px){main{padding:24px}.modal{align-items:center;justify-content:center;padding:15px}.dialog{max-width:620px;border-radius:16px}.formgrid{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}.canvaswrap{height:190px}}
.ops-editor{overflow-x:auto;border:1px solid #dbe3ed;border-radius:10px;padding:10px}.ops-table{width:100%;border-collapse:collapse;min-width:560px;font-size:13px}.ops-table th,.ops-table td{padding:7px;border-bottom:1px solid #e5eaf0;text-align:center}.ops-table input{width:100%;min-width:75px;padding:8px;border:1px solid #ccd6e2;border-radius:7px}.ops-table .op-name{min-width:130px}.op-line-total{font-weight:700;white-space:nowrap}.op-remove{border:0;background:#fff0f0;color:#b42318;border-radius:7px;padding:7px 10px}.ops-editor .btn{margin-top:9px}
/* V9.4 portrait-first app shell */
html,body{width:100%;height:100%;min-height:100%;overscroll-behavior:none}
body{min-height:100dvh;background:#eef2f7}
header{height:58px;padding-inline:14px;box-shadow:0 2px 10px #172f520b}
main{width:100%;max-width:560px;min-height:calc(100dvh - 116px);margin:0 auto;padding:14px 12px calc(100px + env(safe-area-inset-bottom))}
nav{max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;box-shadow:0 -5px 22px #172f5210;padding-inline:8px}
.modal{align-items:stretch;justify-content:center;padding:0;background:#eef2f7}
.dialog{width:100%;max-width:560px;height:100dvh;max-height:100dvh;border-radius:0;padding:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 30px #172f5215}
.dialoghead{flex:0 0 58px;margin:0;padding:0 14px;border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:2}
#modalBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
.formgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.field.full{grid-column:1}
.field input,.field select,.field textarea{border-radius:11px;background:#fbfcfe}
.actions{position:sticky;bottom:-1px;background:#fff;padding:10px 12px calc(8px + env(safe-area-inset-bottom));margin:14px -12px -18px;border-top:1px solid var(--line);z-index:3}
.actions button{flex:1;min-height:48px}
.ops-editor{padding:0;border:0;overflow:visible;background:transparent}
.operations-list{display:grid;gap:10px}
.operation-card{background:#f8faff;border:1px solid #dce5f1;border-radius:13px;padding:11px;display:grid;gap:9px}
.operation-card-head,.operation-total{display:flex;align-items:center;justify-content:space-between;gap:8px}
.operation-card-head b{font-size:12px;color:#334155}
.op-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.op-field span,.operation-total span{font-size:11px;color:#64748b;font-weight:700}
.op-field input{width:100%;min-width:0;padding:10px;border:1px solid #d5dee9;border-radius:9px;background:white;font-size:16px;min-height:43px}
.op-numbers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.operation-total{border-top:1px dashed #cbd5e1;padding-top:8px}
.operation-total strong{font-size:14px;color:#1d4ed8}
.op-remove{border:0;background:#fff0f0;color:#b42318;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700}
.add-op-btn{width:100%;min-height:45px;margin-top:10px}
.canvaswrap{height:190px}
@media(min-width:700px){main{padding:24px 18px 100px}.dialog{max-width:560px}.formgrid{grid-template-columns:minmax(0,1fr)}.field.full{grid-column:1}}
@media(max-width:380px){.op-field input{padding:9px;font-size:15px}.dialoghead h2{font-size:15px}}

.service-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:8px}
.service-picks label{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line,#dbe2ea);border-radius:10px;background:var(--card,#fff);font-weight:600}
.service-picks input{width:19px;height:19px;accent-color:#2563eb}
@media(max-width:520px){.service-picks{grid-template-columns:1fr 1fr}.service-picks label{font-size:13px;padding:10px 8px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">SD</div><div><b>STEEL DESIGN ERP</b><small>V11.2 · Workshop App · Order Edit</small></div></div><button class="btn" id="backup">نسخ احتياطي</button></header>
<main id="app"></main>
<nav>
<button class="active" data-page="home">الرئيسية</button><button data-page="jobs">الطلبات</button><button data-page="production">الإنتاج</button><button data-page="stock">المخزون</button><button data-page="customers">الزبائن</button>
</nav>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">طلب جديد</h2><button class="btn" id="close">إغلاق</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const KEY="steel-design-v91-web-preview";
let db=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"stock":[],"customers":[]}'),page="home",draftPhotos=[],strokes=[],zoom=1,canvas,ctx,activeTool="pen",dimensionStart=null,dimensionLabels=[];
db.jobs=Array.isArray(db.jobs)?db.jobs:[];db.stock=Array.isArray(db.stock)?db.stock:[];db.customers=Array.isArray(db.customers)?db.customers:[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=()=> "OF-"+new Date().toISOString().slice(2,10).replaceAll("-","")+"-"+Math.random().toString(36).slice(2,5).toUpperCase();
function head(title,sub,button=""){return `<div class="pagehead"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${button}</div>`}
function sdPrintWindow(title,body,css){
 const w=window.open("","_blank");
 if(!w){alert("اسمح بالنوافذ المنبثقة لهذا التطبيق ثم أعد المحاولة");return}
 w.document.open();
 w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>${css}</style></head><body>${body}<script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`);
 w.document.close();
}
function printBON(j){
 const ops=(j.operations||[]).map(o=>`<tr><td>${esc(o.name||"عملية")}</td><td>${Number(o.qty||0)}</td><td>${Number(o.unitPrice||0).toLocaleString("fr-FR")}</td><td>${Number(o.lineTotal||((o.qty||0)*(o.unitPrice||0))).toLocaleString("fr-FR")}</td></tr>`).join("");
 const total=Number(j.total||0),paid=Number(j.paid||0),remain=total-paid;
 const body=`<header><h2>STEEL DESIGN</h2><b>BON CLIENT</b></header><hr><p><b>رقم الطلب:</b> ${esc(j.id)}</p><p><b>الزبون:</b> ${esc(j.customer||"—")}</p><p><b>الهاتف:</b> ${esc(j.phone||"—")}</p><p><b>القطعة:</b> ${esc(j.description||"—")}</p><table><thead><tr><th>العملية</th><th>كمية</th><th>سعر الوحدة</th><th>المجموع</th></tr></thead><tbody>${ops||`<tr><td>${esc(j.service||"الخدمة")}</td><td>${j.qty||1}</td><td>${total.toLocaleString("fr-FR")}</td><td>${total.toLocaleString("fr-FR")}</td></tr>`}</tbody></table><section><p>الإجمالي: <b>${total.toLocaleString("fr-FR")} دج</b></p><p>المدفوع: <b>${paid.toLocaleString("fr-FR")} دج</b></p><p class="remain">المتبقي: <b>${remain.toLocaleString("fr-FR")} دج</b></p></section><footer>شكراً لثقتكم بـ STEEL DESIGN</footer>`;
 sdPrintWindow("BON CLIENT "+j.id,body,`@page{size:80mm auto;margin:4mm}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;width:72mm;margin:0 auto;color:#111;font-size:11px}header{text-align:center}h2{font-size:18px;margin:3px}header b{font-size:15px}p{margin:6px 0;line-height:1.5}table{width:100%;border-collapse:collapse;font-size:9px;margin-top:10px}th,td{border-bottom:1px dashed #777;padding:5px 2px;text-align:center}th:first-child,td:first-child{text-align:right}section{border-top:1px solid #111;margin-top:10px;padding-top:6px}.remain{font-size:13px;border-top:1px solid #111;padding-top:6px}footer{text-align:center;margin-top:16px;border-top:1px dashed #777;padding-top:8px}`);
}
function printLabel(j){
 const body=`<main><h3>STEEL DESIGN</h3><div class="code">${esc(j.id)}</div><b class="item">${esc(j.description||j.service||"قطعة معدنية")}</b><p>الزبون: ${esc(j.customer||"—")}</p><div>الكمية: <b>${Number(j.qty||1)}</b></div><div>المادة: ${esc(j.material||"—")} · ${esc(j.thickness||"—")} mm</div><div>الأبعاد: ${esc(j.dimensions||"—")}</div></main>`;
 sdPrintWindow("ملصق القطعة "+j.id,body,`@page{size:60mm 40mm;margin:2mm}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;margin:0;color:#111}main{width:56mm;height:36mm;overflow:hidden;border:1px solid #222;padding:2mm;text-align:center}h3{font-size:12px;margin:0 0 2mm}.code{font-size:10px;border-bottom:1px solid #777;padding-bottom:1mm;margin-bottom:1mm}.item{font-size:12px;display:block;margin:1mm 0}p,div{font-size:9px;margin:1mm 0}`);
}

function render(){
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="home")home();if(page==="jobs")jobs();if(page==="production")production();if(page==="stock")stock();if(page==="customers")customers();}
function home(){app.innerHTML=head("مركز القيادة","نظرة عامة على نشاط الورشة",'<button class="btn primary" id="new">+ طلب جديد</button>')+`<div class="stats"><div class="card"><div class="stat-label">إجمالي الطلبات</div><div class="stat-value">${db.jobs.length}</div></div><div class="card"><div class="stat-label">قيد التنفيذ</div><div class="stat-value">${db.jobs.filter(x=>x.status==="جديد"||x.status==="قيد التنفيذ").length}</div></div><div class="card"><div class="stat-label">مكتملة</div><div class="stat-value">${db.jobs.filter(x=>x.status==="جاهز للتسليم"||x.status==="مكتمل").length}</div></div><div class="card"><div class="stat-label">الزبائن</div><div class="stat-value">${new Set(db.jobs.map(x=>x.customer)).size}</div></div></div><section class="panel"><h2>آخر الطلبات</h2>${jobList(db.jobs.slice().reverse().slice(0,5))}</section>`;$("#new").onclick=newJob;}
function jobList(rows){return rows.length?'<div class="list">'+rows.map(j=>`<div class="job"><div class="jobtop"><b>${esc(j.id)} · ${esc(j.customer)}</b><span class="pill">${esc(j.status)}</span></div><p>${esc(j.description)} · ${esc((j.services&&j.services.length)?j.services.join("، "):j.service)} · الكمية ${j.qty}</p><button class="btn soft" data-open="${j.id}">التفاصيل والكروكي</button></div>`).join("")+'</div>':'<div class="empty">لا توجد طلبات بعد. أنشئ أول طلب للبدء.</div>'}
function jobs(){app.innerHTML=head("طلبات الورشة","الطلبات المحفوظة على هذا الجهاز",'<button class="btn primary" id="new">+ طلب جديد</button>')+`<section class="panel">${jobList(db.jobs.slice().reverse())}</section>`;$("#new").onclick=newJob;bindOpen();}
function bindOpen(){document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>detail(b.dataset.open));}
function production(){
 const active=db.jobs.filter(j=>j.status!=="مكتمل"&&j.status!=="جاهز للتسليم");
 const ready=db.jobs.filter(j=>j.status==="جاهز للتسليم");
 app.innerHTML=head("لوحة الإنتاج","متابعة مراحل التصنيع والمواد لكل أمر تصنيع")+
 `<div class="stats"><div class="card"><div class="stat-label">طلبات تنتظر البدء</div><div class="stat-value">${db.jobs.filter(j=>j.status==="جديد").length}</div></div><div class="card"><div class="stat-label">قيد الإنتاج</div><div class="stat-value">${db.jobs.filter(j=>j.status==="قيد التنفيذ").length}</div></div><div class="card"><div class="stat-label">جاهزة للتسليم</div><div class="stat-value">${ready.length}</div></div></div>`+
 `<section class="panel"><h2>أوامر التصنيع المفتوحة</h2>${active.length?'<div class="list">'+active.map(j=>{const stages=j.productionStages||((j.services||[j.service]).filter(Boolean).map(n=>({name:n,status:"انتظار"})));const done=stages.filter(x=>x.status==="مكتمل").length;return `<div class="job"><div class="jobtop"><b>${esc(j.id)} · ${esc(j.customer)}</b><span class="pill">${esc(j.status)}</span></div><p>${esc(j.description)} · ${esc(j.material||"مادة غير محددة")} · ${esc(j.qty)} قطعة</p><p>تقدم العمليات: ${done}/${stages.length} مكتملة</p><button class="btn soft" data-open="${esc(j.id)}">فتح أمر التصنيع ومراحل الإنتاج</button><button class="btn primary" data-ready="${esc(j.id)}">إنهاء ملف الإنتاج · جاهز للتسليم</button></div>`}).join("")+'</div>':'<div class="empty">لا توجد أوامر تصنيع مفتوحة.</div>'}</section>`+
 `<section class="panel"><h2>طلبات جاهزة للتسليم</h2>${ready.length?'<div class="list">'+ready.map(j=>`<div class="job"><div class="jobtop"><b>${esc(j.id)} · ${esc(j.customer)}</b><span class="pill">جاهز للتسليم</span></div><p>${esc(j.description)} · الكمية ${esc(j.qty)}</p><button class="btn soft" data-open="${esc(j.id)}">تفاصيل الطلب</button></div>`).join('')+'</div>':'<div class="empty">لا توجد طلبات جاهزة للتسليم حالياً.</div>'}</section>`;
 bindOpen();document.querySelectorAll("[data-ready]").forEach(b=>b.onclick=()=>markReady(b.dataset.ready));
}

function stock(){
 const rows=Array.isArray(db.stock)?db.stock:[];
 const zones=[["A","مواد مستلمة تنتظر الفحص"],["B","مواد معتمدة وجاهزة للإنتاج"],["C","منتجات مكتملة وجاهزة للتسليم"]];
 const total=rows.reduce((s,x)=>s+Number(x.qty||0),0);
 app.innerHTML=head("إدارة المخزون","تسجيل المواد والصفائح والبقايا ومتابعة مواقع التخزين",'<button class="btn primary" id="addStock">＋ إضافة مادة</button>')+
 `<div class="stats"><div class="card"><div class="stat-label">عدد الأصناف</div><div class="stat-value">${rows.length}</div></div><div class="card"><div class="stat-label">إجمالي الكميات</div><div class="stat-value">${total.toLocaleString("fr-DZ")}</div></div></div>`+
 zones.map(([z,desc])=>{const list=rows.filter(x=>(x.zone||"A")===z);return `<section class="panel"><h2>المنطقة ${z}</h2><div class="muted">${desc}</div>${list.length?'<div class="list" style="margin-top:10px">'+list.map(x=>`<div class="job"><div class="jobtop"><b>${esc(x.name||"مادة")}</b><span class="pill">${Number(x.qty||0)} ${esc(x.unit||"قطعة")}</span></div><p>${esc(x.material||"—")} · ${esc(x.thickness||"—")} mm · ${esc(x.dimensions||"—")}</p><p>النوع: ${esc(x.kind||"مخزون")} ${x.supplier?'· المورد: '+esc(x.supplier):''}</p>${x.notes?`<p>${esc(x.notes)}</p>`:""}<div class="actions"><button class="btn soft" data-stock-edit="${esc(x.id)}">تعديل</button><button class="btn" data-stock-move="${esc(x.id)}">نقل منطقة</button><button class="btn danger" data-stock-del="${esc(x.id)}">حذف</button></div></div>`).join("")+'</div>':'<div class="empty">لا توجد مواد مسجلة في هذه المنطقة.</div>'}</section>`}).join("");
 $("#addStock").onclick=()=>stockForm();
 document.querySelectorAll("[data-stock-edit]").forEach(b=>b.onclick=()=>stockForm(b.dataset.stockEdit));
 document.querySelectorAll("[data-stock-move]").forEach(b=>b.onclick=()=>stockMove(b.dataset.stockMove));
 document.querySelectorAll("[data-stock-del]").forEach(b=>b.onclick=()=>{const x=db.stock.find(x=>x.id===b.dataset.stockDel);if(x&&confirm("حذف الصنف "+(x.name||"")+" من المخزون؟")){db.stock=db.stock.filter(y=>y.id!==x.id);save();stock()}});
}
function stockForm(key){
 const old=key?db.stock.find(x=>x.id===key):null;if(key&&!old)return;

<script>

});
