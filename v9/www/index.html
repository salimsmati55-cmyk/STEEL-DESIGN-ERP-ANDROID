<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc"><title>STEEL DESIGN ERP · V9 Next Generation</title>
<style>
:root{font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#182536;background:#f5f7fa;font-synthesis:none;--ink:#182536;--muted:#718096;--line:#e2e8f0;--paper:#fff;--blue:#1d4ed8;--blue2:#eaf1ff;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:#f5f7fa}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:12px;background:#172f52;color:#fff;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.top-actions{display:flex;align-items:center;gap:8px}.status{font-size:11px;color:var(--green);padding:7px 10px;background:#effaf2;border-radius:20px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{background:#fff;border-left:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.nav{border:0;background:transparent;text-align:right;padding:12px;border-radius:10px;color:#526174;font-weight:700}.nav:hover,.nav.active{background:var(--blue2);color:#1d4ed8}
main{padding:24px;max-width:1600px;width:100%;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.pagehead h1{font-size:24px;margin:0 0 5px}.muted{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:#fff;color:#25364b;border-radius:9px;padding:10px 14px;font-weight:700}.btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.btn.soft{background:#eef3ff;color:#1d4ed8;border-color:#dbe6ff}.btn.small{padding:7px 10px;font-size:12px}.btn.danger{color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 3px 14px #1e293b06}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:27px;font-weight:900;margin-top:8px}.panel{margin-top:16px}.panel h2{font-size:16px;margin:0 0 14px}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:12px 9px;text-align:right;border-bottom:1px solid var(--line);font-size:12px}th{background:#f8fafc;color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;border-radius:20px;padding:5px 9px;font-size:11px;background:#edf2f7;color:#475569}.pill.blue{background:#eaf1ff;color:#1d4ed8}.pill.green{background:#eaf8ef;color:#15803d}.pill.amber{background:#fff6e8;color:#b45309}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;overflow:auto}.lane{background:#edf1f6;border-radius:12px;padding:10px;min-height:170px}.lane h3{font-size:13px;margin:4px 4px 10px}.jobcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}.jobcard b{font-size:12px}.jobcard p{font-size:11px;color:var(--muted);margin:7px 0}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#526174}.field input,.field select,.field textarea{border:1px solid #d5dee9;border-radius:9px;padding:11px;background:#fff;color:var(--ink);min-width:0;width:100%}.field textarea{min-height:70px}
.modal{position:fixed;inset:0;background:#0f172a66;z-index:10;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.dialog{background:#fff;border-radius:16px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialoghead h2{margin:0;font-size:18px}.empty{padding:30px;text-align:center;color:var(--muted)}.money{font-variant-numeric:tabular-nums}.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.step{padding:6px 8px;border-radius:7px;background:#f1f5f9;font-size:10px}.step.done{background:#eaf8ef;color:#15803d}.step.active{background:#eaf1ff;color:#1d4ed8}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{flex-direction:row;overflow:auto;border-left:0;border-bottom:1px solid var(--line);padding:7px}.nav{white-space:nowrap;padding:9px 11px}main{padding:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(4,240px)}header{padding:0 12px}}
@media(max-width:520px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.pagehead{align-items:flex-start;flex-direction:column}.top-actions .status{display:none}.brand b{font-size:12px}}
@media print{header,aside,.no-print{display:none!important}.shell{display:block}main{padding:0}.dialog{max-height:none}}
</style></head>
<body>
<header><div class="brand"><div class="logo">SD</div><div><b>STEEL DESIGN ERP</b><small>V9 · Next Generation · Job-centric</small></div></div><div class="top-actions"><span class="status" id="dbStatus">قاعدة البيانات المحلية</span><button class="btn" id="backupBtn">تصدير نسخة</button><label class="btn">استعادة<input id="restoreInput" type="file" accept="application/json" hidden></label></div></header>
<div class="shell"><aside>
<button class="nav active" data-view="home">مركز القيادة</button><button class="nav" data-view="jobs">ملفات العمل</button><button class="nav" data-view="dispatch">لوحة الإنتاج</button><button class="nav" data-view="stock">المخزون و REC</button><button class="nav" data-view="accounts">الحسابات</button>
<div style="margin-top:auto;padding:12px;color:#94a3b8;font-size:10px;line-height:1.8">نسخة V9 تجريبية مستقلة.<br>لا تمس بيانات V7.11 أو V8.</div></aside><main id="app"></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">ملف عمل جديد</h2><button class="btn small" id="closeModal">إغلاق</button></div><div id="modalBody"></div></div></div>
<script type="module">
const DB='steel-design-erp-v9-prototype',VERSION=1;
const $=s=>document.querySelector(s),app=$('#app');
let db,state={jobs:[],stock:[],payments:[],events:[],view:'home'};
const money=n=>Number(n||0).toLocaleString('fr-FR')+' دج';
const uid=p=>p+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,VERSION);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('records'))q.result.createObjectStore('records')};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function load(){db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('records','readonly'),q=tx.objectStore('records').get('state');q.onsuccess=()=>{if(q.result)state={...state,...q.result};res()};q.onerror=()=>rej(q.error)})}
async function save(){return new Promise((res,rej)=>{const tx=db.transaction('records','readwrite');tx.objectStore('records').put({...state,updatedAt:new Date().toISOString()},'state');tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function event(type,jobId,detail={}){state.events.unshift({id:uid('EV'),type,jobId,detail,at:new Date().toISOString()});state.events=state.events.slice(0,1000)}
function setView(v){state.view=v;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#closeModal').onclick=()=>$('#modal').classList.remove('open');
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}
const operations=['ليزر','قص مقص','ثني','تجميع','مصاعد وهياكل','تشطيب'];
const opStatus=['في الانتظار','قيد التنفيذ','مكتملة'];
function jobProgress(j){const a=j.operations||[];return a.length?Math.round(a.filter(x=>x.status==='مكتملة').length/a.length*100):0}
function dueDate(days){const d=new Date();d.setDate(d.getDate()+Number(days||0));return d.toISOString().slice(0,10)}
function head(title,sub,actions=''){return '<div class="pagehead"><div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div><div class="toolbar">'+actions+'</div></div>'}
function render(){if(state.view==='home')home();if(state.view==='jobs')jobsPage();if(state.view==='dispatch')dispatch();if(state.view==='stock')stockPage();if(state.view==='accounts')accounts()}
function home(){const open=state.jobs.filter(j=>j.status!=='مكتمل').length,late=state.jobs.filter(j=>j.dueDate<new Date().toISOString().slice(0,10)&&j.status!=='مكتمل').length,bal=state.jobs.reduce((s,j)=>s+Math.max(0,j.total-j.paid),0),active=state.jobs.reduce((s,j)=>s+(j.operations||[]).filter(o=>o.status==='قيد التنفيذ').length,0);
app.innerHTML=head('مركز القيادة','صورة حقيقية لحركة الورشة، وليس مجرد أرقام شكلية','<button class="btn primary" id="newJob">+ ملف عمل جديد</button><button class="btn" id="newRec">+ REC استلام خام</button>')+
'<section class="stats"><div class="card"><div class="stat-label">ملفات العمل المفتوحة</div><div class="stat-value">'+open+'</div></div><div class="card"><div class="stat-label">عمليات تعمل الآن</div><div class="stat-value">'+active+'</div></div><div class="card"><div class="stat-label">ملفات متأخرة</div><div class="stat-value" style="color:'+(late?'#b91c1c':'#15803d')+'">'+late+'</div></div><div class="card"><div class="stat-label">مستحقات الزبائن</div><div class="stat-value" style="font-size:22px">'+money(bal)+'</div></div></section>'+
'<section class="panel"><h2>الأعمال التي تحتاج انتباه</h2>'+jobsTable(state.jobs.filter(j=>j.status!=='مكتمل').sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,8))+'</section>'+
'<section class="panel"><h2>آخر أحداث الورشة</h2>'+eventsTable(state.events.slice(0,7))+'</section>';
$('#newJob').onclick=newJobForm;$('#newRec').onclick=recForm}
function jobsTable(list){if(!list.length)return '<div class="empty">لا توجد ملفات عمل بعد. أنشئ أول ملف عمل.</div>';return '<div class="tablewrap"><table><thead><tr><th>رقم الملف</th><th>الزبون</th><th>الخدمة</th><th>التقدم</th><th>التسليم</th><th>المتبقي</th><th>الحالة</th><th></th></tr></thead><tbody>'+list.map(j=>'<tr><td><b>'+esc(j.id)+'</b></td><td>'+esc(j.customer)+'</td><td>'+esc(j.service)+'</td><td>'+jobProgress(j)+'%</td><td>'+esc(j.dueDate)+'</td><td class="money">'+money(j.total-j.paid)+'</td><td><span class="pill '+(j.status==='مكتمل'?'green':'blue')+'">'+j.status+'</span></td><td><button class="btn small soft" data-open="'+j.id+'">فتح الملف</button></td></tr>').join('')+'</tbody></table></div>'}
function jobsPage(){app.innerHTML=head('ملفات العمل','كل طلب زبون هو ملف واحد يجمع التصنيع والمخزون والوثائق والحسابات','<button class="btn primary" id="newJob">+ ملف جديد</button>')+'<section class="panel">'+jobsTable(state.jobs.slice().reverse())+'</section>';$('#newJob').onclick=newJobForm;bindOpen()}
function bindOpen(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>jobDetail(b.dataset.open))}
function newJobForm(){modal('إنشاء ملف عمل جديد','<form id="jobForm"><div class="formgrid"><div class="field"><label>اسم الزبون *</label><input name="customer" required></div><div class="field"><label>الهاتف (اختياري)</label><input name="phone" inputmode="tel"></div><div class="field"><label>الخدمة الرئيسية</label><select name="service">'+['قص ليزر','قص مقص','ثني','تجميع','كبائن مصاعد','هياكل حديدية','خدمات متعددة','أخرى'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>المادة</label><input name="material" placeholder="Inox 304 / Fer..."></div><div class="field"><label>السماكة (mm)</label><input name="thickness" type="number" step=".1"></div><div class="field"><label>الأبعاد</label><input name="dimensions" placeholder="مثال 1250 × 2500 mm"></div><div class="field"><label>الكمية</label><input name="qty" type="number" min="1" value="1" required></div><div class="field"><label>مدة الإنجاز بالأيام</label><input name="days" type="number" min="0" value="2"></div><div class="field"><label>سعر البيع الإجمالي</label><input name="total" type="number" min="0" value="0"></div><div class="field"><label>تكلفة الخام</label><input name="rawCost" type="number" min="0" value="0"></div><div class="field"><label>النقل</label><input name="transport" type="number" min="0" value="0"></div><div class="field"><label>المبلغ المدفوع</label><input name="paid" type="number" min="0" value="0"></div><div class="field full"><label>مسار التصنيع — اختر العمليات المطلوبة</label><div style="display:flex;gap:10px;flex-wrap:wrap">'+operations.map((x,i)=>'<label style="font-size:12px"><input type="checkbox" name="ops" value="'+x+'" '+(i===0?'checked':'')+'> '+x+'</label>').join('')+'</div></div><div class="field full"><label>ملاحظات / وصف الكروكي</label><textarea name="notes"></textarea></div></div><div class="toolbar" style="margin-top:16px"><button class="btn primary">حفظ ملف العمل وإنشاء مسار الإنتاج</button></div></form>');
$('#jobForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),ops=f.getAll('ops');const days=Number(f.get('days')||0),job={id:uid('JOB'),customer:f.get('customer').trim(),phone:f.get('phone').trim(),service:f.get('service'),material:f.get('material'),thickness:f.get('thickness'),dimensions:f.get('dimensions'),qty:Number(f.get('qty')||1),createdAt:new Date().toISOString(),dueDate:dueDate(days),durationDays:days,total:Number(f.get('total')||0),rawCost:Number(f.get('rawCost')||0),transport:Number(f.get('transport')||0),paid:Number(f.get('paid')||0),notes:f.get('notes'),status:'جديد',operations:ops.map((name,i)=>({id:uid('OP'),name,status:'في الانتظار',sequence:i+1,worker:''}))};state.jobs.push(job);event('إنشاء ملف عمل',job.id,{operations:ops.length});await save();$('#modal').classList.remove('open');setView('jobs');jobDetail(job.id)}}
function jobDetail(id){const j=state.jobs.find(x=>x.id===id);if(!j)return;const steps=j.operations.map(o=>'<div class="step '+(o.status==='مكتملة'?'done':o.status==='قيد التنفيذ'?'active':'')+'">'+o.sequence+'. '+esc(o.name)+' · '+o.status+'</div>').join('');modal('ملف العمل '+j.id,'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>'+esc(j.customer)+'</b><div class="muted">'+esc(j.service)+' · '+esc(j.material)+' '+esc(j.thickness)+'mm · '+esc(j.dimensions)+'</div></div><span class="pill blue">'+j.status+'</span></div><div class="steps">'+steps+'</div><div class="muted">التسليم المتوقع: '+j.dueDate+' · الكمية: '+j.qty+'</div></div><div class="panel"><h3 style="font-size:14px">العمليات</h3>'+j.operations.map(o=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #e2e8f0;gap:10px"><span>'+o.sequence+'. '+esc(o.name)+' <span class="muted">'+o.status+'</span></span><button class="btn small" data-op="'+o.id+'">تحديث الحالة</button></div>').join('')+'</div><div class="panel"><h3 style="font-size:14px">الملخص التجاري — لا يظهر في OF</h3><div class="muted">الإجمالي: '+money(j.total)+' · الخام: '+money(j.rawCost)+' · النقل: '+money(j.transport)+' · المدفوع: '+money(j.paid)+' · المتبقي: '+money(j.total-j.paid)+'</div></div><div class="toolbar"><button class="btn" id="printOF">طباعة OF دون أسعار</button><button class="btn soft" id="printBon">طباعة BON CLIENT</button><button class="btn" id="addPay">تسجيل دفعة</button></div>');
document.querySelectorAll('[data-op]').forEach(b=>b.onclick=async()=>{const o=j.operations.find(x=>x.id===b.dataset.op);o.status=opStatus[(opStatus.indexOf(o.status)+1)%opStatus.length];j.status=j.operations.every(x=>x.status==='مكتملة')?'مكتمل':j.operations.some(x=>x.status==='قيد التنفيذ')?'قيد التصنيع':'جديد';event('تحديث عملية',j.id,{operation:o.name,status:o.status});await save();jobDetail(id)});$('#printOF').onclick=()=>printDoc(j,false);$('#printBon').onclick=()=>printDoc(j,true);$('#addPay').onclick=()=>paymentForm(j)}
function printDoc(j,financial){const w=window.open('','_blank');if(!w){alert('اسمح بفتح نافذة الطباعة');return}const rows=financial?'<p>السعر الإجمالي: '+money(j.total)+'</p><p>تكلفة الخام: '+money(j.rawCost)+'</p><p>النقل: '+money(j.transport)+'</p><p>المدفوع: '+money(j.paid)+'</p><h3>المتبقي: '+money(j.total-j.paid)+'</h3>':'';w.document.write('<html lang="ar" dir="rtl"><meta charset="utf-8"><title>'+(financial?'BON CLIENT':'OF')+'</title><style>body{font-family:Tahoma,Arial;padding:25px;color:#111}h1{text-align:center}table{width:100%;border-collapse:collapse}td,th{border:1px solid #aaa;padding:10px;text-align:right}</style><h1>STEEL DESIGN · '+(financial?'BON CLIENT':'أمر تصنيع OF')+'</h1><p>رقم الملف: '+esc(j.id)+' · الزبون: '+esc(j.customer)+'</p><table><tr><th>الخدمة</th><th>المادة</th><th>السماكة</th><th>الأبعاد</th><th>الكمية</th></tr><tr><td>'+esc(j.service)+'</td><td>'+esc(j.material)+'</td><td>'+esc(j.thickness)+'</td><td>'+esc(j.dimensions)+'</td><td>'+j.qty+'</td></tr></table><h3>مسار التصنيع</h3><p>'+j.operations.map(o=>esc(o.sequence+'. '+o.name)).join(' ← ')+'</p><p>الملاحظات: '+esc(j.notes)+'</p>'+rows+'<script>window.onload=()=>window.print()<\/script></html>');w.document.close()}
function paymentForm(j){modal('تسجيل دفعة','<form id="payForm"><div class="field"><label>المبلغ</label><input name="amount" type="number" min="1" max="'+Math.max(0,j.total-j.paid)+'" required></div><div class="field" style="margin-top:10px"><label>طريقة الدفع</label><select name="method"><option>نقداً</option><option>تحويل</option><option>أخرى</option></select></div><button class="btn primary" style="margin-top:14px">تسجيل الدفعة</button></form>');$('#payForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0||amount>j.total-j.paid)return alert('تحقق من المبلغ');j.paid+=amount;state.payments.push({id:uid('PAY'),jobId:j.id,amount,method:f.get('method'),at:new Date().toISOString()});event('تسجيل دفعة',j.id,{amount});await save();$('#modal').classList.remove('open');jobDetail(j.id)}}
function dispatch(){app.innerHTML=head('لوحة الإنتاج','العمليات موزعة حسب حالة التنفيذ — افتح ملف العمل لتحديث كل عملية')+'<section class="board">'+opStatus.map(s=>'<div class="lane"><h3>'+s+' ('+state.jobs.reduce((n,j)=>n+(j.operations||[]).filter(o=>o.status===s).length,0)+')</h3>'+state.jobs.flatMap(j=>(j.operations||[]).filter(o=>o.status===s).map(o=>'<div class="jobcard"><b>'+esc(j.id)+' · '+esc(o.name)+'</b><p>'+esc(j.customer)+' · '+esc(j.material)+' · '+j.qty+' قطعة</p><button class="btn small soft" data-open="'+j.id+'">فتح ملف العمل</button></div>')).join('')+'</div>').join('')+'</section>';bindOpen()}
function recForm(){modal('استلام مواد خام · REC','<form id="recForm"><div class="formgrid"><div class="field"><label>المورد / المصدر</label><input name="supplier"></div><div class="field"><label>المادة</label><input name="material" required></div><div class="field"><label>السماكة mm</label><input name="thickness" type="number" step=".1"></div><div class="field"><label>الأبعاد mm</label><input name="dimensions" placeholder="1500 × 3000"></div><div class="field"><label>الكمية</label><input name="qty" type="number" min="1" value="1"></div><div class="field"><label>مكان التخزين</label><select name="location"><option value="A">A · استلام / انتظار فحص</option><option value="B">B · معتمد للإنتاج</option><option value="C">C · منتج جاهز</option></select></div></div><button class="btn primary" style="margin-top:14px">حفظ REC</button></form>');$('#recForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),lot={id:uid('REC'),supplier:f.get('supplier'),material:f.get('material'),thickness:f.get('thickness'),dimensions:f.get('dimensions'),qty:Number(f.get('qty')||1),location:f.get('location'),createdAt:new Date().toISOString()};state.stock.push(lot);event('استلام مواد REC',lot.id,{material:lot.material,qty:lot.qty,location:lot.location});await save();$('#modal').classList.remove('open');setView('stock')}}
function stockPage(){app.innerHTML=head('المخزون و REC','تتبع المواد حسب مناطق A / B / C','<button class="btn primary" id="newRec">+ استلام REC</button>')+'<section class="stats">'+['A','B','C'].map((x,i)=>'<div class="card"><div class="stat-label">المنطقة '+x+'</div><div class="stat-value">'+state.stock.filter(s=>s.location===x).length+'</div></div>').join('')+'</section><section class="panel"><div class="tablewrap"><table><thead><tr><th>رقم REC</th><th>المورد</th><th>المادة</th><th>السماكة</th><th>الأبعاد</th><th>الكمية</th><th>الموقع</th><th></th></tr></thead><tbody>'+state.stock.map(s=>'<tr><td>'+s.id+'</td><td>'+esc(s.supplier)+'</td><td>'+esc(s.material)+'</td><td>'+esc(s.thickness)+'</td><td>'+esc(s.dimensions)+'</td><td>'+s.qty+'</td><td><span class="pill">'+s.location+'</span></td><td><button class="btn small" data-move="'+s.id+'">نقل للموقع التالي</button></td></tr>').join('')+'</tbody></table></div></section>';$('#newRec').onclick=recForm;document.querySelectorAll('[data-move]').forEach(b=>b.onclick=async()=>{const s=state.stock.find(x=>x.id===b.dataset.move);s.location={A:'B',B:'C',C:'C'}[s.location];event('نقل مخزون',s.id,{location:s.location});await save();stockPage()})}
function accounts(){const total=state.jobs.reduce((s,j)=>s+j.total,0),paid=state.jobs.reduce((s,j)=>s+j.paid,0);app.innerHTML=head('الحسابات','ملخص تجاري مستمد من ملفات العمل وسجل الدفعات')+'<section class="stats"><div class="card"><div class="stat-label">قيمة الأعمال</div><div class="stat-value">'+money(total)+'</div></div><div class="card"><div class="stat-label">المحصل</div><div class="stat-value">'+money(paid)+'</div></div><div class="card"><div class="stat-label">المستحق</div><div class="stat-value">'+money(total-paid)+'</div></div><div class="card"><div class="stat-label">عدد الدفعات</div><div class="stat-value">'+state.payments.length+'</div></div></section><section class="panel"><h2>سجل الدفعات</h2><div class="tablewrap"><table><thead><tr><th>المرجع</th><th>ملف العمل</th><th>المبلغ</th><th>الطريقة</th><th>التاريخ</th></tr></thead><tbody>'+state.payments.map(p=>'<tr><td>'+p.id+'</td><td>'+p.jobId+'</td><td>'+money(p.amount)+'</td><td>'+esc(p.method)+'</td><td>'+p.at.slice(0,10)+'</td></tr>').join('')+'</tbody></table></div></section>'}
function eventsTable(list){return list.length?'<div class="tablewrap"><table><thead><tr><th>الحدث</th><th>المرجع</th><th>التوقيت</th></tr></thead><tbody>'+list.map(e=>'<tr><td>'+esc(e.type)+'</td><td>'+esc(e.jobId)+'</td><td>'+e.at.slice(0,16).replace('T',' ')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">سجل الأحداث سيظهر هنا.</div>'}
$('#backupBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'STEEL DESIGN ERP V9 prototype',format:'sd-v9-prototype-backup',schemaVersion:VERSION,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='steel-design-v9-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('#restoreInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x.format!=='sd-v9-prototype-backup'||x.schemaVersion!==VERSION||!x.state)throw Error('ملف النسخة غير متوافق');if(!confirm('سيتم استبدال بيانات نموذج V9 الحالية فقط. هل تتابع؟'))return;state={...state,...x.state};await save();render();alert('تم استرجاع نسخة V9')}catch(err){alert('تعذر الاسترجاع: '+err.message)}finally{e.target.value=''}};
try{await load();$('#dbStatus').textContent='تخزين V9 المحلي جاهز';render()}catch(e){$('#dbStatus').textContent='تعذر فتح قاعدة البيانات';app.innerHTML='<section class="panel"><h2>تعذر فتح قاعدة البيانات المحلية</h2><p>'+esc(e.message)+'</p></section>'}
</script></body></html>
