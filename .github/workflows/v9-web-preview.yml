name: V9 Web Preview

on:
  push:
    branches: [v9-web-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v9-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V9 web preview
        uses: actions/checkout@v4
      - name: Validate V9 web files
        run: |
          test -f v9/www/index.html
          test -f v9/www/app-v9.js
          test -f v9/www/core.js
          test -f v9/www/repository.js
          node --check v9/www/app-v9.js
          node --check v9/www/core.js
          node --check v9/www/repository.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: v9/www
      - name: Deploy web preview
        id: deployment
        uses: actions/deploy-pages@v4
