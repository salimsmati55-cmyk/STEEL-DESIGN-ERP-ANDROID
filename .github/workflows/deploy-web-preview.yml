name: Deploy STEEL DESIGN ERP V8.3 Web Preview

on:
  push:
    branches:
      - v8.3-web-settings-ui
    paths:
      - "v8/www/**"
      - ".github/workflows/deploy-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: steel-design-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V8.3 preview
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web application
        uses: actions/upload-pages-artifact@v3
        with:
          path: v8/www

      - name: Publish web preview
        id: deployment
        uses: actions/deploy-pages@v4
