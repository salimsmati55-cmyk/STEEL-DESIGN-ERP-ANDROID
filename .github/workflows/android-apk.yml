name: Build STEEL DESIGN ERP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Extract V11.2 package
        run: |
          mkdir -p project
          unzip -q 'STEEL_DESIGN_ERP_ANDROID_V7_11_BUILD_PACKAGE(3).zip' -d project

      - name: Locate application
        id: app
        shell: bash
        run: |
          PACKAGE_FILE="$(find project -name package.json -type f | head -n 1)"
          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json not found"
            exit 1
          fi
          echo "dir=$(dirname "$PACKAGE_FILE")" >> "$GITHUB_OUTPUT"

      - name: Install and prepare Android
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          npm install
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Set Android update version
        working-directory: ${{ steps.app.outputs.dir }}/android
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 12/' app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "11.2"/' app/build.gradle
          grep -nE 'versionCode|versionName' app/build.gradle

      - name: Build Android APK
        working-directory: ${{ steps.app.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STEEL-DESIGN-ERP-APK-V11.2
          path: ${{ steps.app.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
