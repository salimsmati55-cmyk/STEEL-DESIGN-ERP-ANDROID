name: Build STEEL DESIGN ERP V9 Android APK
on:
  workflow_dispatch:
  push:
    branches: [ v9-nextgen ]
    paths:
      - 'v9/**'
      - '.github/workflows/v9-android-apk.yml'
permissions:
  contents: read
env:
  NODE_VERSION: '22'
jobs:
  test-and-build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v9
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install V9 dependencies
        run: npm install
      - name: Run V9 tests
        run: npm test
      - name: Generate isolated V9 Android project
        run: npx cap add android
      - name: Sync V9 web application
        run: npx cap sync android
      - name: Build V9 debug APK
        working-directory: v9/android
        run: ./gradlew assembleDebug
      - name: Upload V9 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-design-erp-v9-debug-apk
          path: v9/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
