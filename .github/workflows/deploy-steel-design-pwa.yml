name: Deploy STEEL DESIGN ERP PWA

on:
  push:
    branches:
      - v8.3-web-settings-ui
    paths:
      - "v8/www/**"
      - ".github/workflows/deploy-steel-design-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PWA files
        run: |
          test -f v8/www/index.html
          test -f v8/www/app.js
          test -f v8/www/styles.css
          test -f v8/www/manifest.webmanifest
          test -f v8/www/sw.js
          test -f v8/www/icon.svg
          node --check v8/www/app.js
          node --check v8/www/src/storage/indexeddb.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: v8/www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
