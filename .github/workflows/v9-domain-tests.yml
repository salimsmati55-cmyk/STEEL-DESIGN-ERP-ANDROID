name: V9 Domain Tests
on:
  push:
    branches: [v9-nextgen]
    paths:
      - "v9/**"
  pull_request:
    paths:
      - "v9/**"
jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: v9
